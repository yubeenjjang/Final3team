# W65 공개 IP HTTP 시험 배포용 오버레이. 로컬 compose.yaml과 함께 사용한다.
# 도메인/인증서가 없으므로 이 구성은 HTTPS가 아니다.
services:
  db:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      APP_ENV: production

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.http:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
